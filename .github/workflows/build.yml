name: Build and Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Build
        run: go build -v -o pusher
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Run go vet
        run: go vet ./...

      # The Linux and Windows Wi-Fi backends are build-tagged, so a plain vet
      # on macOS never compiles them.
      - name: Vet every target platform
        run: |
          for target in darwin linux windows; do
            echo "vetting GOOS=$target"
            GOOS=$target go vet ./... || exit 1
          done
      
      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi
      
      - name: Test cross-compilation
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null
          GOOS=darwin GOARCH=arm64 go build -o /dev/null
          GOOS=windows GOARCH=amd64 go build -o /dev/null

      # Scanning for the robot's Wi-Fi goes through CoreWLAN, so macOS has a
      # second build with a fallback for when cgo is off. Nothing else compiles
      # that file.
      - name: Build macOS without cgo
        run: CGO_ENABLED=0 go build -o /dev/null
